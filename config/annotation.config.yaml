# =============================================================================
# VEP annotation pipeline — configuration
# =============================================================================
# Every annotation source is a toggleable block: set `enabled: true|false` and
# give a `path`. A source whose file is missing at run time is auto-skipped
# with a warning (the run does NOT fail) unless `required: true`.
#
# Availability tiers (see docs/ANNOTATIONS.md):
#   auto          – fetched by scripts/download_references.sh
#   auto-per-run  – fetched fresh every run (ClinVar)
#   bring-your-own-large     – large/registered download; you supply it
#   bring-your-own-custom    – lab-generated track; not public
# =============================================================================

# -----------------------------------------------------------------------------
# Container: how to run VEP. `runtime` = docker | podman | singularity | apptainer
# -----------------------------------------------------------------------------
container:
  runtime: docker
  image: "vep-annotate:latest"        # built by docker/build.sh
  vep_image_tag: "release_113.4"      # validated bundle; change only in a tested software release
  loftee_branch: "grch38"             # MUST be grch38 for GRCh38
  # Extra bind-mounts (host:container). Reference dirs are auto-mounted from paths below.
  extra_mounts: []

# -----------------------------------------------------------------------------
# Reference genome + VEP cache (species/assembly-wide settings)
# -----------------------------------------------------------------------------
reference:
  species: homo_sapiens
  assembly: GRCh38
  # Root dir holding the VEP offline cache (the INSTALL.pl `-c` dir).
  vep_cache_dir: "references/vep_cache"     # tier: auto
  # Reference FASTA (bgzipped). Required for HGVS + LOFTEE + SpliceAI.
  fasta:
    enabled: true
    required: true
    path: "references/fasta/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"  # tier: auto

# -----------------------------------------------------------------------------
# Input assembly + GRCh37/hg19 intake
# -----------------------------------------------------------------------------
# GRCh38 is the only annotation and cohort assembly. A GRCh37/hg19 VCF can be
# converted before PASS/coding filtering with --input-assembly GRCh37. `auto`
# requires reliable header evidence and refuses to guess when the header is
# ambiguous. Re-alignment/re-calling on GRCh38 remains preferable when reads
# are available.
input:
  # Safest workstation default: read reference/contig metadata from the VCF.
  # Ambiguous headers stop with a clear prompt instead of silently assuming.
  default_assembly: auto     # GRCh38 | GRCh37 | auto

liftover:
  enabled: true
  bcftools_version: "1.20"   # pinned in docker/Dockerfile
  # Exact published plugin source used by the validated container build.
  plugin_commit: "909d23019e19aeadf3bf6fe1407fd6afc094592a"
  grch37_to_grch38:
    enabled: true
    # Source sequence is required for assembly-gap indels and REF/ALT swaps.
    # Primary contigs are normalized to Ensembl 1..22/X/Y/MT.
    source_reference: hg19
    source_fasta: "references/liftover/hg19.primary.fa.gz"  # tier: auto
    # UCSC chain with source/target contigs normalized to 1..22/X/Y/MT.
    chain: "references/liftover/hg19ToGRCh38.ensembl.over.chain.gz"  # tier: auto
  # Validated initial scope: primary-contig SNVs and short indels. Longer,
  # symbolic, breakend, spanning-deletion, decoy, and alt-contig records are
  # retained in a separate unsupported VCF rather than silently discarded.
  max_allele_length: 50

# -----------------------------------------------------------------------------
# Region restriction  (the main PC-vs-HPC lever)
# -----------------------------------------------------------------------------
# DEFAULT: restrict to coding exons + essential/consensus splice sites. This
# pre-filters the input VCF with `bcftools view -R <bed>` BEFORE VEP, so VEP
# only processes on-target variants. On a whole-genome VCF this cuts the work
# from tens of millions of variants to the ~1-2% that are coding/splice —
# turning a multi-hour HPC job into minutes on a workstation.
#
# NOTE: VEP's own --coding_only filters the OUTPUT but still PROCESSES every
# variant, so it gives no speedup. The speedup comes from the BED pre-filter.
region:
  coding_only: true          # DEFAULT. false => annotate all variants (WGS/non-coding; HPC-scale)
  # The coding+splice BED is built from the CDS features of the
  # release-matched Ensembl GTF (same coordinates as your VEP cache — no
  # contig-name mismatch) by scripts/build_coding_bed.sh; to use your own
  # regions instead, set region.custom_bed below.
  # Padding (bp) added to each side of every CDS block, to capture splice sites.
  # 8 bp matches the splice consensus window dbNSFP annotates (-3..+8) and the
  # Sequence Ontology splice_region definition (3 exonic / 8 intronic). The
  # essential GT-AG dinucleotides (+/-1..2) are a subset of this window.
  padding_bp: 8
  # Built/cached BED (bgzipped + tabix). Auto-generated if missing.
  bed: "references/regions/coding_splice.padded.bed.gz"
  # OPTIONAL user BED override (e.g. a gene-panel / exome-capture BED). If set
  # and non-empty, this is used verbatim instead of building from the GTF.
  custom_bed: ""

# -----------------------------------------------------------------------------
# Whole-genome review resources
# -----------------------------------------------------------------------------
# SCREEN cCREs are intersected as a native BED during local WGS import. They
# are not added to VEP CSQ annotations. Registry V4 is pinned so an upstream
# SCREEN update cannot silently change which variants enter a review dataset.
wgs_review:
  ccre:
    enabled: true
    version: "SCREEN Registry V4"
    bed: "references/regions/screen.registry-v4.GRCh38.ccre.bed.gz"
    source_url: "https://downloads.wenglab.org/Registry-V4/GRCh38-cCREs.bed"
    assembly: GRCh38
  # Optional categorical tissue and donor-aware baseline immune-cell evidence.
  # This is a review layer over the same Registry V4 catalog, not a VEP field,
  # target-gene assignment, or combined regulatory score. The preparation
  # script writes this manifest; IEI_SCREEN_CONTEXT_MANIFEST may override it.
  screen_context:
    enabled: true
    manifest: ""
  # Compact gene-level TSS context is derived automatically from the same
  # release-matched Ensembl GTF used by the pipeline. It is regional context,
  # never a cCRE target-gene prediction.
  gene_tss:
    path: "references/regions/Homo_sapiens.GRCh38.113.gene_tss.tsv"
    gtf: "references/regions/Homo_sapiens.GRCh38.113.gtf.gz"
    ensembl_release: "113"
    assembly: GRCh38
    window_bp: 500000

# -----------------------------------------------------------------------------
# Run / performance / output
# -----------------------------------------------------------------------------
run:
  # Clinical default: annotate only records that explicitly passed caller QC.
  # Override per run with --include-filtered for review/debugging.
  pass_only: true
  fork: 8                    # parallel forks; set to your core count (vep_hg38.sh used 64)
  buffer_size: 5000
  force_overwrite: true

output:
  # VCF output preserves sample GT/zygosity (unlike --tab). Do not change unless
  # you specifically want a TSV and are willing to lose zygosity.
  format: vcf                # vcf | tab
  compress: bgzip            # bgzip | none  (bgzip => .vcf.gz + tabix index)
  vep_stats: true            # write the *_summary.html VEP stats report

# -----------------------------------------------------------------------------
# Annotation completeness certificate
# -----------------------------------------------------------------------------
# Written beside every completed VCF as both JSON (machine/audit use) and HTML
# (human review). Coverage denominators are annotation-specific: missense for
# AlphaMissense/CADD, predicted LoF for LOFTEE, and MANE SNVs for the bundled
# SpliceAI table. A warning does not discard or alter any variant.
annotation_qc:
  enabled: true
  critical_dbnsfp_fields: ["AlphaMissense_score", "CADD_phred"]
  warn_below:
    dbnsfp_missense: 0.80
    loftee_plof: 0.90
    loftee_ptc_frameshift: 0.90
    spliceai_mane_snv: 0.90
  max_missing_examples: 20

# -----------------------------------------------------------------------------
# Core VEP annotation flags (mirror vep_hg38.sh)
# -----------------------------------------------------------------------------
core:
  # Retain every transcript consequence for reanalysis, while marking one
  # preferred consequence for each ALT allele + gene with PICK=1.
  pick: true
  pick_flag: "--flag_pick_allele_gene"
  pick_order:
    - mane_select
    - mane_plus_clinical
    - canonical
    - appris
    - tsl
    - biotype
    - ccds
    - rank
    - length
  symbol: true               # gene symbol
  hgvs: true                 # HGVSc / HGVSp
  numbers: true              # exon/intron numbers
  canonical: true
  appris: true
  tsl: true
  ccds: true
  mane: true                 # MANE_SELECT / MANE_PLUS_CLINICAL for UI default
  allele_number: true        # robust ALT-to-CSQ mapping for multiallelic VCF records
  biotype: true
  sift: "p"                  # p=prediction only, s=score, b=both, or false
  polyphen: "p"
  af_gnomade: true           # gnomAD exomes AF
  af_gnomadg: true           # gnomAD genomes AF
  max_af: true               # MAX_AF/MAX_AF_POPS (popfreqmax for UI filtering)
  # Any extra raw VEP flags to append verbatim:
  extra_flags: []

# -----------------------------------------------------------------------------
# Plugins  (installed in /plugins inside the container)
# -----------------------------------------------------------------------------
plugins:

  # dbNSFP — ONE file consolidates dozens of precomputed scores that used to
  # need separate plugins/downloads: CADD, REVEL, AlphaMissense, SIFT, PolyPhen,
  # PrimateAI, MetaRNN, GERP, phyloP/phastCons, and more. tier: bring-your-own-large.
  #
  # Get the file (manual, one-time) from https://www.dbnsfp.org/ — academic
  # registration required. Since v5.1 the project distributes the variant
  # table as ONE tabix-indexed BGZF file per genome build, ready for VEP;
  # download dbNSFP<ver>_grch38.gz (+ .tbi + .md5) and install it with
  # scripts/prepare_dbnsfp.sh or the UI's Choose-folder flow (fast: verify +
  # move, no rebuild). Legacy per-chromosome ZIPs are still supported and are
  # re-sorted on GRCh38 coordinates by the same script (~200 GB scratch).
  dbNSFP:                     # tier: bring-your-own-large
    enabled: true
    required: true
    version: "5.4a"
    releases_url: "https://www.dbnsfp.org/releases/"
    # Default is the managed annotation-dataset location; the UI's dbNSFP
    # preparation installs here. A lab-specific absolute path may replace it
    # in a local config copy and is then used verbatim.
    path: "references/dbnsfp/dbNSFP5.4a_grch38.gz"
    # Core columns always pulled into CSQ. Additional curated predictors can be
    # selected for each job in the local UI; the generated job config appends
    # only those fields. Avoid `ALL` (hundreds of columns and very large VCFs).
    # The default panel is deliberately small (AlphaMissense, CADD, REVEL,
    # SIFT, PolyPhen-2); every further predictor is selected per job in the
    # local UI, which appends its columns to the generated job config.
    columns:
      - SIFT_score
      - SIFT_pred
      - Polyphen2_HDIV_score
      - Polyphen2_HDIV_pred
      - CADD_phred
      - CADD_raw
      - REVEL_score
      - AlphaMissense_score
      - AlphaMissense_pred

  LoF:                       # LOFTEE — tier: auto (Broad loftee_data GRCh38)
    enabled: true
    required: true
    # loftee_path is the in-container LOFTEE dir; leave "auto" to use $LOFTEE_DIR.
    loftee_path: "auto"
    human_ancestor_fa: "references/loftee/human_ancestor.fa.gz"
    conservation_file: "references/loftee/loftee.sql"
    gerp_bigwig: "references/loftee/gerp_conservation_scores.homo_sapiens.GRCh38.bw"

  # SpliceAI — Ensembl MANE v1.4 masked SNV scores for GRCh38. tier: auto.
  # Required by the default diagnostic profile and downloaded by
  # scripts/download_references.sh. This public table covers SNVs; a lab may
  # add an optional `indel:` VCF here if it has a compatible indexed dataset.
  SpliceAI:
    enabled: true
    required: true
    snv: "references/spliceai/spliceai_scores.masked.snv.ensembl_mane_v1.4.grch38.vcf.gz"

  # CADD v1.7 genome-wide scores. The standard VEP CADD plugin queries the
  # official score-only BGZF tables directly; the much larger inclAnno tables
  # and a converted/merged VCF are neither required nor used. The official
  # indel table covers gnomAD genomes r4.0 indels, so novel indels can remain
  # unscored. CADD is displayed after import and is not an import-time filter.
  CADD_WGS:
    enabled: false           # whole-genome profile only
    required: false
    version: "1.7"
    snv: "references/cadd/whole_genome_SNVs.tsv.gz"
    indels: "references/cadd/gnomad.genomes.r4.0.indel.tsv.gz"
    source_url: "https://kircherlab.bihealth.org/download/CADD/v1.7/GRCh38/"
    license: "non-commercial use"

  # PromoterAI — licensed precomputed Illumina scores, prepared locally by
  # scripts/prepare_promoterai.sh. The plugin matches both allele and transcript
  # TSS; score data are never shipped in this repository or container.
  PromoterAI:
    enabled: false           # whole-genome profile only
    required: false
    file: "references/promoterai/promoterai_scores.tsv.gz"
    transcript_map: "references/promoterai/promoterai_transcripts.tsv"
    manifest: "references/promoterai/promoterai.manifest.json"

  # LoGoFunc — public GRCh38 canonical-missense mechanism predictions from
  # Zenodo record 13835271. The bundled plugin requires an exact genomic
  # allele, Ensembl transcript, residue position, and amino-acid substitution
  # match, protecting against VEP 106 -> 113 transcript/protein drift.
  LoGoFunc:
    enabled: false            # optional research annotation; enable explicitly in the UI
    required: false
    version: "Zenodo 13835271 (2024-09-24)"
    file: "references/logofunc/LoGoFuncVotingEnsemble_metadata_preds_final.csv.gz"
    manifest: "references/logofunc/logofunc.manifest.json"
    source_url: "https://zenodo.org/records/13835271"
    source_doi: "10.5281/zenodo.13835271"
    paper_doi: "10.1186/s13073-023-01261-9"
    md5: "d50a4601227140c295985b87a37cea7d"

# -----------------------------------------------------------------------------
# Custom annotation tracks  (VEP --custom)
# Each: file, format (bed|vcf), and vcf-specific type/coords/fields.
# -----------------------------------------------------------------------------
custom_tracks:

  RepeatMasker:              # tier: auto (UCSC hg38 rmsk, cleaned for VEP)
    enabled: true
    required: false
    # Built by scripts/download_references.sh from UCSC goldenPath rmsk.txt.gz:
    # BED of repeat intervals, `chr` prefix stripped + chrM->MT to match the
    # Ensembl cache, bgzipped + tabix-indexed. name col = repClass|repFamily|repName.
    file: "references/custom/repeatmasker_hg38.bed.gz"
    short_name: RepeatMasker
    format: bed

  SegDup:                    # tier: auto (UCSC hg38 genomicSuperDups, cleaned)
    enabled: true
    required: false
    # Built by scripts/download_references.sh from UCSC genomicSuperDups.txt.gz:
    # BED of segmental-duplication intervals, `chr` stripped + chrM->MT,
    # bgzipped + tabix-indexed. name col = fracMatch score of the dup.
    file: "references/custom/segmental_dups_hg38.bed.gz"
    short_name: SegDup
    format: bed

  ClinVar:                   # tier: auto-per-run (fetched fresh each run)
    enabled: true
    required: false
    # Path is (re)written by scripts/fetch_clinvar.sh each run. Leave as-is.
    file: "references/clinvar/clinvar_latest.GRCh38.vcf.gz"
    short_name: ClinVar
    format: vcf
    type: exact
    coords: 0
    fields: ["CLNSIG", "CLNSIGCONF", "CLNREVSTAT", "CLNDN"]

# -----------------------------------------------------------------------------
# ClinVar auto-fetch (scripts/fetch_clinvar.sh)
# -----------------------------------------------------------------------------
clinvar:
  auto_fetch: true           # download latest NCBI ClinVar VCF each run
  # NCBI weekly GRCh38 ClinVar VCF. {ASSEMBLY} is filled from reference.assembly.
  url: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_{ASSEMBLY}/clinvar.vcf.gz"
  dest_dir: "references/clinvar"
  keep_dated_copy: true      # keep clinvar_<releasedate>.GRCh38.vcf.gz alongside latest

# -----------------------------------------------------------------------------
# ClinGen Evidence Repository expert-panel variant classifications
# -----------------------------------------------------------------------------
# Installed as a versioned local snapshot from the official public export.
# Exact GRCh38 allele matching is applied after VEP; one allele may retain
# multiple disease/MOI-specific expert-panel assertions. No patient data leave
# the workstation and no live API is used during annotation.
clingen_erepo:
  enabled: true
  required: true
  url: "https://erepo.clinicalgenome.org/evrepo/api/summary/classifications/download?type=csv"
  dest_dir: "references/clingen_erepo"
  database: "references/clingen_erepo/clingen_erepo.sqlite3"
  vcf: "references/clingen_erepo/clingen_erepo.GRCh38.vcf"
  manifest: "references/clingen_erepo/manifest.json"

# -----------------------------------------------------------------------------
# Post-processing (after VEP)
# -----------------------------------------------------------------------------
post_processing:
  # LOFTEE evaluates 50_BP_RULE at the variant coordinate. For frameshifts the
  # relevant premature termination codon (PTC) is downstream in the shifted
  # reading frame. Recompute the rule at that PTC from the release-matched local
  # GTF + FASTA, replace 50_BP_RULE inside LoF_info, and retain the original
  # value plus calculation provenance in appended CSQ fields.
  loftee_ptc_50bp:
    enabled: true
    required: true
    threshold_bp: 50
    gtf: "references/regions/Homo_sapiens.GRCh38.113.gtf.gz"
    replace_lof_info: true

  # Reconstruct sample-specific transcript/protein haplotypes for frameshift
  # indels. Confirmed same-haplotype frame restoration is distinguished from
  # possible restoration when heterozygous phase is unresolved. Per-variant
  # VEP/LOFTEE evidence is retained for auditability.
  haplotype_consequences:
    enabled: true
    required: true

  # Adds ClinVar_path_aa_match INFO flag: 1 if a variant's (SYMBOL, protein
  # position) collides with a KNOWN PATHOGENIC missense ClinVar variant at the
  # same residue. Reimplements the awk step from vep_hg38.sh for VCF output.
  clinvar_aa_match:
    enabled: true
    # Pathogenicity terms (in CLNSIG) that count as "pathogenic".
    pathogenic_terms: ["Pathogenic", "Likely_pathogenic", "Pathogenic/Likely_pathogenic"]
