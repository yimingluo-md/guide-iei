<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>GUIDE-IEI — DNA and immune receptor</title>
  <defs>
    <linearGradient id="teal" x1="180" y1="80" x2="820" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#145B52"/>
      <stop offset="1" stop-color="#0B443F"/>
    </linearGradient>
    <path id="strand-a" d="M422 280 C422 365 602 435 602 520 C602 605 422 675 422 760"/>
    <path id="strand-b" d="M602 280 C602 365 422 435 422 520 C422 605 602 675 602 760"/>
    <clipPath id="upper-crossing"><rect x="470" y="370" width="84" height="60"/></clipPath>
    <clipPath id="lower-crossing"><rect x="470" y="610" width="84" height="60"/></clipPath>
    <mask id="a-over-under" maskUnits="userSpaceOnUse" x="360" y="240" width="310" height="560">
      <rect x="360" y="240" width="310" height="560" fill="white"/>
      <use href="#strand-b" stroke="black" stroke-width="54" clip-path="url(#upper-crossing)"/>
    </mask>
    <mask id="b-over-under" maskUnits="userSpaceOnUse" x="360" y="240" width="310" height="560">
      <rect x="360" y="240" width="310" height="560" fill="white"/>
      <use href="#strand-a" stroke="black" stroke-width="54" clip-path="url(#lower-crossing)"/>
    </mask>
  </defs>
  <!-- Transparent outer margin; no pedestal, lettering or baked shadow. -->
  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#teal)"/>
  <!-- Cell membrane, interrupted by its receptor at the upper right. -->
  <path d="M650 245 A300 300 0 1 0 764 349" stroke="#F4F2E9" stroke-width="22" stroke-linecap="round"/>
  <!-- Separated ribbons preserve the helix crossings at small sizes. -->
  <g stroke="#F4F2E9" stroke-width="34" stroke-linecap="round">
    <use href="#strand-a" mask="url(#a-over-under)"/>
    <use href="#strand-b" mask="url(#b-over-under)"/>
  </g>
  <g stroke="#F4F2E9" stroke-width="19" stroke-linecap="round">
    <path d="M460 305 H564 M492 338 H532 M468 500 H556 M468 549 H556"/>
  </g>
  <!-- Y-shaped immune receptor. -->
  <path d="M691 213 L750 280 L812 234 M750 280 V339" stroke="#C7A667" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
