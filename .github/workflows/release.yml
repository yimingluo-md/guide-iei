# Build and publish the release artifacts the in-app updater consumes,
# whenever a version tag is pushed. The tag must match the VERSION file
# and have a CHANGELOG entry — make_release.sh enforces both.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/clean-clone.yml
  release:
    needs: checks
    permissions:
      contents: write
    # A Mac runner builds the native arm64+x86_64 launcher and ad-hoc seals the
    # unsigned app. No paid Developer ID credential is required.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          }
      - name: Build release artifacts
        env:
          IEI_REQUIRE_NATIVE_MAC_LAUNCHER: "1"
        run: bash scripts/make_release.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists (published locally); nothing to do"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/guide-iei-${VERSION}.zip" \
            "dist/GUIDE-IEI-macOS-${VERSION}.zip" \
            dist/sha256sums.txt \
            --title "GUIDE-IEI ${VERSION}" \
            --notes-file dist/release-notes.md
