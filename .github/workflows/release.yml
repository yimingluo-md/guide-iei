# Tags run checks and prepare a DRAFT only. Signed Mac assets are built with
# the maintainer's local Keychain and verified before attachment/publication.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/clean-clone.yml
  release:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          }
      - name: Build source update archive (never the legacy Mac installer)
        run: bash scripts/make_release.sh --source-only
      - name: Prepare a draft prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; no assets or publication state will be changed."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/release-${VERSION}/guide-iei-${VERSION}.zip" \
            "dist/release-${VERSION}/sha256sums.txt" \
            --draft --prerelease \
            --title "GUIDE-IEI ${VERSION} — Apple Silicon beta (awaiting signed installer)" \
            --notes-file "dist/release-${VERSION}/release-notes.md"
