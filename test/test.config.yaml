container:
  runtime: docker
  image: "vep-annotate:latest"
  vep_image_tag: "release_113.4"
  loftee_branch: "grch38"
  extra_mounts: []
reference:
  species: homo_sapiens
  assembly: GRCh38
  vep_cache_dir: "test/fixtures/vep_cache"
  fasta:
    enabled: true
    required: true
    path: "test/fixtures/fasta/genome.fa.gz"
run:
  fork: 4
  buffer_size: 5000
  force_overwrite: true
output:
  format: vcf
  compress: bgzip
  vep_stats: false
core:
  pick: true
  pick_flag: "--pick"
  symbol: true
  hgvs: true
  biotype: true
  sift: "p"
  polyphen: "p"
  af_gnomade: true
  af_gnomadg: true
  extra_flags: []
plugins:
  dbNSFP: {enabled: false}
  LoF:
    enabled: true
    required: false
    loftee_path: "auto"
    human_ancestor_fa: "test/fixtures/loftee/human_ancestor.fa.gz"
    conservation_file: "test/fixtures/loftee/loftee.sql"
    gerp_bigwig: "test/fixtures/loftee/gerp.bw"
  SpliceAI: {enabled: false}
custom_tracks:
  RepeatMasker:
    enabled: true
    required: false
    file: "test/fixtures/custom/repeatmasker.bed.gz"
    short_name: RepeatMasker
    format: bed
  ClinVar:
    enabled: true
    required: false
    file: "test/fixtures/clinvar/clinvar_latest.GRCh38.vcf.gz"
    short_name: ClinVar
    format: vcf
    type: exact
    coords: 0
    fields: ["CLNSIG","CLNSIGCONF","CLNREVSTAT","CLNDN"]
clinvar:
  auto_fetch: false
  url: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_{ASSEMBLY}/clinvar.vcf.gz"
  dest_dir: "test/fixtures/clinvar"
  keep_dated_copy: true
post_processing:
  clinvar_aa_match:
    enabled: true
    pathogenic_terms: ["Pathogenic","Likely_pathogenic","Pathogenic/Likely_pathogenic"]
